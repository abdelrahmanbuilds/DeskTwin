name: Bug report
description: Report a reproducible problem with DeskTwin.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Please remove pairing QR codes, credentials, private files, and personal/network details from logs and screenshots.
  - type: dropdown
    id: platform
    attributes:
      label: Affected platform
      options:
        - Windows preview
        - Windows source build
        - Android preview APK
        - Android source build
        - Windows and Android / pairing or protocol
        - Documentation or workflow
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DeskTwin version or commit
      description: For a preview, use the version shown on the GitHub Release page.
      placeholder: v0.1.2 or commit hash
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: Windows 11 24H2; Android 15 on Pixel 8a
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the exact error text if possible. Redact sensitive details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number the shortest steps that reliably reproduce this issue.
      placeholder: |
        1. Start DeskTwin on Windows...
        2. Pair the Android device...
        3. Open...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or screenshots
      description: Attach only after reviewing for tokens, QR codes, personal files, usernames, and network addresses.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing issue about this problem.
          required: true
        - label: I removed pairing QR codes, credentials, and private or identifying data.
          required: true
