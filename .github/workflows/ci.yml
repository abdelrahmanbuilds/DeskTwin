name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Android debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: Android

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Windows dependencies
        run: python -m pip install -r Windows/Python/dependencies/requirements-winui.txt
      - name: Build WinUI app
        run: dotnet build Windows/WinUI/app/DeskTwin.WinUI.csproj --configuration Release
